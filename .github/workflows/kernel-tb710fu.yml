# TB710FU / SM8650Q（联想小新 Pad Pro GT）— ColorOS 16 移植内核构建
#
# 设计定位：在通用 GKI 内核（android14-6.1-2025-03 / 6.1.128）之上叠加
# ColorOS 修复补丁，产出可刷入的 AnyKernel3 zip。
#
# 与通用 build.yml 的三处关键差别（其余特性全部保留）：
#
#   1. 配置基线是【整份原厂 .config】（targets/tb710fu/config/base.config），
#      不是 gki_defconfig + fragment。gki_defconfig 只声明"要开什么"，不含原厂
#      那 3840 行 "is not set"，追加式构建会让几千个开关落到编译器默认值上，
#      产出的内核与 289 个厂商模块的 modversion CRC 对不上，开机第一屏重启。
#
#   2. 编译走 make，不走 bazel。
#      bazel 的 --defconfig_fragment 装不下 7550 行基线；且 bazel 强制
#      --lto=thin，与本机原厂的 CONFIG_LTO_NONE=y 冲突。
#
#   3. 产物是 AnyKernel3 zip，不含 boot.img / vendor_boot.img。
#      本机 boot.img 的 ramdisk size 为 0（通用 ramdisk 在 init_boot，
#      第一阶段在 vendor_boot），所以 AK3 必须用 split_boot 而非 dump_boot。
#
# 保留的全部特性开关（与 build.yml 一一对应）：
#   KernelSU 变体 / SUSFS / KPM / BBG / Re-Kernel / NoMount /
#   BBRv3 网络增强 / ZRAM LZ4 增强 / CVE-2026-43499 / 一加8E /
#   Droidspaces / NTSync / SUSFS 集成补丁导出

name: 内核构建 - TB710FU (ColorOS 16 移植)

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - "BakaSU"
          - "SukiSU"
          - "SukiSU(40726)"
          - "SukiSU(40548)"
          - "Official"
        default: "BakaSU"
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - "关闭"
          - "禁用SUSFS"
          - "禁用KSU"
        default: "关闭"
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
        default: "disabled (关闭)"
      apply_coloros_patches:
        description: "应用 ColorOS 修复补丁（tb710fu targets）"
        required: true
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（调试用）"
        required: false
        type: boolean
        default: false
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

env:
  TARGET: "tb710fu"
  ANDROID_VERSION: "android14"
  KERNEL_VERSION: "6.1"
  OS_PATCH_LEVEL: "2025-03"
  SUB_LEVEL: "128"
  GKI_COMMIT: "5c2cea985a841939e6d074cbed2019dec0245fcd"

jobs:
  build:
    name: "${{ inputs.kernelsu_variant }}-kernel-${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}-tb710fu"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "     TB710FU 内核构建配置摘要"
          echo "========================================"
          echo "目标设备    : Lenovo TB710FU / SM8650Q / pineapple"
          echo "ROM         : ColorOS 16 移植 (OPD2513)"
          echo "内核版本    : $KERNEL_VERSION.$SUB_LEVEL"
          echo "GKI commit  : $GKI_COMMIT"
          echo "KSU 变体    : ${{ inputs.kernelsu_variant }}"
          echo "KSU 模式    : ${{ inputs.ksu_mode }}"
          echo "SUSFS       : ${{ inputs.ksu_mode == '关闭' }}"
          echo "KPM         : ${{ inputs.use_kpm }}"
          echo "ColorOS补丁 : ${{ inputs.apply_coloros_patches }}"
          echo "ZRAM 增强   : ${{ inputs.use_zram }}"
          echo "BBG         : ${{ inputs.use_bbg }}"
          echo "Re-Kernel   : ${{ inputs.use_rekernel }}"
          echo "NoMount     : ${{ inputs.use_nomount }}"
          echo "网络增强    : ${{ inputs.use_networking }}"
          echo "CVE-43499   : ${{ inputs.cve_2026_43499_patch }}"
          echo "一加8E      : ${{ inputs.supp_op }}"
          echo "Droidspaces : ${{ inputs.droidspaces }}"
          echo "NTSync      : ${{ inputs.droidspaces_ntsync }}"
          echo "SUSFS导出   : ${{ inputs.export_susfs_patches }}"
          echo "产物模式    : ${{ inputs.artifact_upload_mode }}"
          echo "========================================"


      - name: 清理磁盘空间
        run: |
          TRASH_DIR=/tmp/.background_trash
          sudo rm -rf "$TRASH_DIR"
          mkdir -p "$TRASH_DIR"/{1..17}

          safe_mv() { [ -e "$1" ] && sudo mv "$1" "$2" || true; }
          export -f safe_mv

          safe_mv /usr/share/dotnet           "$TRASH_DIR"/1  &
          safe_mv /usr/local/lib/android      "$TRASH_DIR"/2  &
          safe_mv /opt/ghc                    "$TRASH_DIR"/3  &
          safe_mv /opt/hostedtoolcache/CodeQL "$TRASH_DIR"/4  &
          safe_mv /usr/local/aws-sam-cli      "$TRASH_DIR"/5  &
          safe_mv /usr/local/share/chromium   "$TRASH_DIR"/6  &
          safe_mv /usr/local/share/powershell "$TRASH_DIR"/7  &
          safe_mv /usr/local/lib/heroku       "$TRASH_DIR"/8  &
          safe_mv /usr/local/lib/node_modules "$TRASH_DIR"/9  &
          safe_mv /opt/az                     "$TRASH_DIR"/10 &
          safe_mv /opt/microsoft/powershell   "$TRASH_DIR"/11 &
          safe_mv /opt/hostedtoolcache/go     "$TRASH_DIR"/12 &
          safe_mv /opt/hostedtoolcache/PyPy   "$TRASH_DIR"/13 &
          safe_mv /opt/hostedtoolcache/node   "$TRASH_DIR"/14 &
          sudo bash -c "mv /usr/local/bin/aliyun /usr/local/bin/azcopy /usr/local/bin/bicep \
            /usr/local/bin/cmake-gui /usr/local/bin/cpack /usr/local/bin/helm \
            /usr/local/bin/hub /usr/local/bin/kubectl /usr/local/bin/minikube \
            /usr/local/bin/node /usr/local/bin/packer /usr/local/bin/sam /usr/local/bin/stack \
            /usr/local/bin/terraform /usr/local/bin/oc $TRASH_DIR/15 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/julia* $TRASH_DIR/16 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/bin/pulumi* $TRASH_DIR/17 2>/dev/null || true" &
          wait

          (
            sudo nice -n 19 ionice -c 3 rm -rf "$TRASH_DIR"
            sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            sudo apt-get clean >/dev/null 2>&1 || true
            command -v docker >/dev/null 2>&1 && docker rmi $(docker images -q) 2>/dev/null || true
          ) >/dev/null 2>&1 &
          disown


      - name: 检出代码仓库
        uses: actions/checkout@v7

      - name: 初始化构建环境
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/$ANDROID_VERSION-$KERNEL_VERSION-$SUB_LEVEL"
          mkdir -p "$KERNEL_ROOT"

          LEGACY_SUKISU_CONFIG=""
          case "${{ inputs.kernelsu_variant }}" in
            SukiSU\(*\)) LEGACY_SUKISU_CONFIG="$GITHUB_WORKSPACE/config/${{ inputs.kernelsu_variant }}.config" ;;
          esac

          if [ -n "$LEGACY_SUKISU_CONFIG" ] && [ ! -f "$LEGACY_SUKISU_CONFIG" ]; then
            echo "未找到 ${{ inputs.kernelsu_variant }} 固定提交配置: $LEGACY_SUKISU_CONFIG" >&2
            exit 1
          fi

          cat >> $GITHUB_ENV << EOF
          CONFIG=$ANDROID_VERSION-$KERNEL_VERSION-$SUB_LEVEL
          KERNEL_ROOT=$KERNEL_ROOT
          LEGACY_SUKISU_CONFIG=$LEGACY_SUKISU_CONFIG
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          TARGET_DIR=$GITHUB_WORKSPACE/targets/$TARGET
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          OUT_DIR=$GITHUB_WORKSPACE/kernel-out
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          # storage.googleapis.com 偶发 TLS 握手失败（curl 退出码 35），全量构建
          # 各跑一次，累积下来命中概率不低。--retry-all-errors 才会重试握手类错误。
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV


      - name: 显示配置信息
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "加载配置文件: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi
          if [ -n "$LEGACY_SUKISU_CONFIG" ]; then
            echo "加载老版 SukiSU 固定提交配置: $LEGACY_SUKISU_CONFIG"
            cat "$LEGACY_SUKISU_CONFIG"
          fi


      - name: 校验 target 资源完整性
        run: |
          missing=0
          for f in "$TARGET_DIR/config/base.config" \
                   "$TARGET_DIR/config/delta.config" \
                   "$TARGET_DIR/config/abi_symbollist.raw" \
                   "$TARGET_DIR/patches/ordered.list" \
                   "$TARGET_DIR/scripts/prepare_config.sh" \
                   "$TARGET_DIR/scripts/apply_patches.sh" \
                   "$TARGET_DIR/scripts/verify_abi.sh"; do
            if [ -f "$f" ]; then
              echo "  ✓ ${f#$GITHUB_WORKSPACE/}"
            else
              echo "::error::缺少 ${f#$GITHUB_WORKSPACE/}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1


      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential \
            libssl-dev bison flex libelf-dev dwarves bc device-tree-compiler


      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV


      - name: 恢复 ccache 缓存
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: tb710fu-${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}-ccache-${{ github.sha }}
          restore-keys: |-
            tb710fu-${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}-ccache-
            tb710fu-ccache-

      - name: 缓存工具链
        uses: actions/cache@v5
        with:
          path: |-
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      - name: 下载工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg


      - name: 生成签名密钥
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH


      - name: 配置 Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"


      - name: 克隆依赖仓库
        run: |
          clone_with_retry() {
            local repository="$1" destination="$2"
            shift 2
            local attempt delay rc=1
            for attempt in 1 2 3 4 5; do
              echo "克隆 $repository（第 $attempt/5 次）..."
              rm -rf -- "$destination" || return 1
              if git clone "$repository" "$destination" "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((15 * (1 << (attempt - 1)) + RANDOM % 10))
                echo "::warning::克隆 $repository 失败（退出码 $rc），${delay} 秒后重试"
                sleep "$delay" || return 1
              fi
            done
            rm -rf -- "$destination" || return 1
            echo "克隆 $repository 失败，已用尽 5 次尝试（退出码 $rc）" >&2
            return "$rc"
          }

          ANYKERNEL_BRANCH="gki-2.0"

          echo "克隆 AnyKernel3..."
          clone_with_retry https://github.com/WildKernels/AnyKernel3.git AnyKernel3 -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "准备补丁资源..."
          clone_with_retry https://github.com/WildKernels/kernel_patches.git kernel_patches
          clone_with_retry https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch
          echo "使用当前仓库补丁目录: $ZZH_PATCHES"
          clone_with_retry https://github.com/Numbersf/Action-Build.git Action-Build --depth=1


      - name: 初始化并同步内核源码
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          FORMATTED_BRANCH="$ANDROID_VERSION-$KERNEL_VERSION-$OS_PATCH_LEVEL"
          MAX_ATTEMPTS=3
          RETRY_DELAY=15
          SYNC_TIMEOUT=15m

          init_repo() {
            $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} --repo-rev=v2.16 || return 1

            local ok=false
            for _ in 1 2 3; do
              if REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH}); then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "git ls-remote 查询 ${FORMATTED_BRANCH} 失败"
              return 1
            fi

            DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
            TAG_FALLBACK=""
            if grep -q deprecated <<< "$REMOTE_BRANCH"; then
              echo "检测到已弃用的分支: $FORMATTED_BRANCH"
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
            elif [ -z "$REMOTE_BRANCH" ]; then
              # 分支已被上游删除时，回退到编号最大的 _rN tag
              local latest_tag
              latest_tag=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null \
                | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' \
                | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
              if [ -z "$latest_tag" ]; then
                echo "::error::分支 ${FORMATTED_BRANCH} 在上游既无分支也无发布 tag"
                return 1
              fi
              echo "分支 ${FORMATTED_BRANCH} 已被上游删除，回退到发布 tag: $latest_tag"
              sed -i "/path=\"common\"/ s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${latest_tag}\"|" $DEFAULT_MANIFEST_PATH
              TAG_FALLBACK="$latest_tag"
            fi
          }

          attempt=1
          while :; do
            echo "第 $attempt/$MAX_ATTEMPTS 次初始化并同步，分支: common-${FORMATTED_BRANCH}（单次超时 $SYNC_TIMEOUT）"
            df -h "$PWD" | tail -n +2 || true

            rc=0
            if init_repo; then
              SYNC_FLAGS="-c -j4 --jobs-checkout=4 --no-tags --no-clone-bundle --retry-fetches=3"
              [ "$attempt" -gt 1 ] && SYNC_FLAGS="$SYNC_FLAGS --force-sync"
              timeout -k 60 "$SYNC_TIMEOUT" $REPO sync $SYNC_FLAGS || rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "内核源码同步成功（第 $attempt 次）"
                break
              fi
              if [ "$rc" -eq 124 ]; then
                echo "repo sync 超时（$SYNC_TIMEOUT）"
              else
                echo "repo sync 失败，退出码 $rc"
              fi
            else
              rc=1
              echo "repo init 或分支预检失败"
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::内核源码同步连续 $MAX_ATTEMPTS 次失败"
              exit "$rc"
            fi

            if [ "$attempt" -eq $((MAX_ATTEMPTS - 1)) ]; then
              echo "清空工作目录后重来"
              find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi

            echo "${RETRY_DELAY}s 后重试..."
            sleep "$RETRY_DELAY"
            attempt=$((attempt + 1))
          done

          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV
          echo "TAG_FALLBACK=$TAG_FALLBACK" >> $GITHUB_ENV


      - name: 钉死 GKI commit
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 分支 tip 会随时间移动，而 TB710FU 的所有补丁都是对着固定 commit
          # 的精确行号写的。这里强制检出目标 commit 并校验。
          ACTUAL=$(git rev-parse HEAD)
          echo "分支 tip     : $ACTUAL"
          echo "目标 commit  : $GKI_COMMIT"

          if [ "$ACTUAL" != "$GKI_COMMIT" ]; then
            echo "检测到 tip 与目标不一致，检出目标 commit"
            git fetch --depth=1 origin "$GKI_COMMIT" || \
              git fetch --unshallow origin || true
            git checkout "$GKI_COMMIT"
          fi

          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$GKI_COMMIT" ]; then
            echo "::error::无法检出 $GKI_COMMIT（实际 $ACTUAL）"
            exit 1
          fi
          echo "✓ 已锁定 $ACTUAL"

          # 校验内核版本确实为 6.1.128
          SUBS=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
          echo "内核 sublevel: $SUBS"
          if [ "$SUBS" != "$SUB_LEVEL" ]; then
            echo "::error::sublevel 为 $SUBS，期望 $SUB_LEVEL —— 补丁上下文可能对不上"
            exit 1
          fi


      - name: 应用 Stock Config 伪装
        run: |
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

          if [ ! -f "$STOCK_SRC" ]; then
            echo "未检测到 $STOCK_SRC，跳过 Stock Config 伪装。"
            exit 0
          fi

          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::复制 stock_defconfig 失败: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "已复制 stock_defconfig -> $STOCK_DST"

          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::未找到 $TARGET_MAKEFILE"
            exit 1
          fi

          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data 规则已是 stock_defconfig，跳过。"
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "已替换 config_data 规则: $TARGET_MAKEFILE"
          else
            echo "::error::未在 $TARGET_MAKEFILE 找到规则: $OLD_RULE"
            exit 1
          fi


      - name: 应用 CVE-2026-43499 rtmutex 修复链
        if: inputs.cve_2026_43499_patch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
            "$KERNEL_VERSION" \
            "$SUB_LEVEL" \
            "$GITHUB_WORKSPACE/security_patch"


      - name: 修复 glibc 2.38 兼容性
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          RAW_SUB="$SUB_LEVEL"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          NEEDS_FIX=false
          if [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.10" && $CURRENT_SUB -le 186 ]] ||
             [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.15" && $CURRENT_SUB -le 119 ]] ||
             [[ "$ANDROID_VERSION" == "android14" && "$KERNEL_VERSION" == "6.1" && $CURRENT_SUB -le 43 ]]; then
            NEEDS_FIX=true
          fi

          if [ "$NEEDS_FIX" = true ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              echo "应用 glibc 2.38 兼容性修复..."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

              if [[ "$KERNEL_VERSION" == "5.10" || "$KERNEL_VERSION" == "5.15" ]]; then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi


      - name: 添加一加 8E 处理器支持
        if: inputs.supp_op
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "下载一加 8E 支持补丁..."
          curl -LSs "https://github.com/zzh20188/GKI_KernelSU_SUSFS/raw/refs/heads/dev/hmbird_patch.c" -o hmbird_patch.c
          echo "obj-y += hmbird_patch.o" >> Makefile


      - name: 确定 KernelSU 分支
        if: inputs.ksu_mode != '禁用KSU'
        run: |
          variant_input="${{ inputs.kernelsu_variant }}"

          case "$variant_input" in
            "Official"|"BakaSU")
              BRANCH="-s main"
              ;;
            "SukiSU")
              if [ "${{ inputs.ksu_mode }}" != "关闭" ]; then
                BRANCH="-s main"
              else
                BRANCH="-s builtin"
              fi
              ;;
            "Next")
              BRANCH=""
              ;;
            *)
              if [ -z "$LEGACY_SUKISU_CONFIG" ] || [ ! -f "$LEGACY_SUKISU_CONFIG" ]; then
                echo "未知变体: $variant_input" >&2
                exit 1
              fi
              SUKISU_FIXED_COMMIT=$(grep "^sukisu=" "$LEGACY_SUKISU_CONFIG" | cut -d'=' -f2-)
              if [ -z "$SUKISU_FIXED_COMMIT" ]; then
                echo "未在 $LEGACY_SUKISU_CONFIG 配置 SukiSU 固定提交" >&2
                exit 1
              fi
              BRANCH="-s $SUKISU_FIXED_COMMIT"
              ;;
          esac

          # 检查自定义提交 (仅对 SukiSU 生效)
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ] && [ "$variant_input" == "SukiSU" ]; then
              SUKISU_COMMIT=$(grep "^sukisu=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$SUKISU_COMMIT" ]; then
                BRANCH="-s $SUKISU_COMMIT"
                echo "SukiSU 使用自定义提交: $SUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU 分支: $BRANCH"


      - name: 添加 KernelSU
        if: inputs.ksu_mode != '禁用KSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official")
              echo "添加 KernelSU 官方版..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash $BRANCH

              cd KernelSU
              KSU_GIT_VERSION=$(git rev-list --count HEAD)
              KSU_VERSION=$((20000 + KSU_GIT_VERSION))
              echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

              if [ -f "kernel/Kbuild" ]; then
                sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
              fi
              cd ..
              ;;
            "Next")
              echo "添加 KernelSU-Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev_susfs
              ;;
            "SukiSU")
              echo "添加 ${{ inputs.kernelsu_variant }}..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              ;;
            "BakaSU")
              echo "添加 BakaSU..."
              curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash $BRANCH
              ;;
            *)
              if [ -z "$LEGACY_SUKISU_CONFIG" ]; then
                echo "未知变体: ${{ inputs.kernelsu_variant }}" >&2
                exit 1
              fi
              echo "添加 ${{ inputs.kernelsu_variant }}..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              ;;
          esac

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          else
            echo "KSU_LATEST_COMMIT_DATE=未知" >> $GITHUB_ENV
          fi


      - name: 配置 SukiSU 管理器信息
        if: (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'SukiSU(40726)' || inputs.kernelsu_variant == 'SukiSU(40548)') && inputs.ksu_mode != '禁用KSU'
        working-directory: ${{ env.KERNEL_ROOT }}/KernelSU
        run: |
          KBUILD_FILE="./kernel/Kbuild"
          CUSTOM_TAG="${{ vars.MANAGER_STR }}"

          if [ ! -f "$KBUILD_FILE" ]; then
            echo "未找到 $KBUILD_FILE，跳过 SukiSU 版本标识定制"
            exit 0
          fi

          GIT_HASH=$(git rev-parse --short=8 HEAD)
          BRANCH_NAME="${BRANCH#-s }"
          if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" = "$BRANCH" ]; then
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
          fi

          if [ -n "$CUSTOM_TAG" ]; then
            VERSION_TEMPLATE="v\$1-$CUSTOM_TAG@$BRANCH_NAME[$GIT_HASH]"
          else
            VERSION_TEMPLATE="v\$1-$GIT_HASH@$BRANCH_NAME"
          fi

          awk -v body="$VERSION_TEMPLATE" '
            BEGIN {
              in_block = 0
              replaced = 0
            }
            /^[[:space:]]*define get_ksu_version_full$/ {
              print
              print body
              in_block = 1
              replaced = 1
              next
            }
            in_block && /^[[:space:]]*endef$/ {
              print
              in_block = 0
              next
            }
            !in_block {
              print
            }
            END {
              if (!replaced) {
                exit 1
              }
            }
          ' "$KBUILD_FILE" > "${KBUILD_FILE}.tmp" && mv "${KBUILD_FILE}.tmp" "$KBUILD_FILE"

          echo "已更新 get_ksu_version_full 模板: $VERSION_TEMPLATE"


      - name: 克隆 SUSFS 源码
        if: inputs.ksu_mode == '关闭'
        run: |
          set -euo pipefail

          retry() {
            local attempt rc=1
            for attempt in 1 2 3 4 5; do
              echo "第 $attempt/5 次尝试: $*"
              if "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "::warning::命令失败（退出码 $rc），5 秒后重试: $*"
                sleep 5 || return 1
              fi
            done
            echo "命令失败，已用尽 5 次尝试（退出码 $rc）: $*" >&2
            return "$rc"
          }

          clone_susfs() {
            local rc
            rm -rf -- susfs4ksu || return 1
            if git clone "$1" -b "$SUSFS_BRANCH" susfs4ksu; then
              return 0
            else
              rc=$?
            fi
            rm -rf -- susfs4ksu || return 1
            return "$rc"
          }

          SUSFS_BRANCH="gki-$ANDROID_VERSION-$KERNEL_VERSION"

          echo "克隆 SUSFS (分支: $SUSFS_BRANCH)..."
          if [ -n "$LEGACY_SUKISU_CONFIG" ]; then
            retry clone_susfs https://gitlab.com/simonpunk/susfs4ksu.git
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            if ! retry clone_susfs https://github.com/ShirkNeko/susfs4ksu.git; then
              echo "::warning::ShirkNeko 仓库克隆失败（分支 $SUSFS_BRANCH），回退到 simonpunk 原版..."
              retry clone_susfs https://gitlab.com/simonpunk/susfs4ksu.git
            fi
          else
            retry clone_susfs https://gitlab.com/simonpunk/susfs4ksu.git
          fi

          if [ -n "$LEGACY_SUKISU_CONFIG" ]; then
            SUSFS_FIXED_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$LEGACY_SUKISU_CONFIG" | cut -d'=' -f2- || true)
            if [ -z "$SUSFS_FIXED_COMMIT" ]; then
              echo "未在 $LEGACY_SUKISU_CONFIG 配置 $SUSFS_BRANCH 的固定 SUSFS 提交" >&2
              exit 1
            fi
            echo "${{ inputs.kernelsu_variant }} 固定 SUSFS 提交: $SUSFS_FIXED_COMMIT"
            retry git -C susfs4ksu checkout "$SUSFS_FIXED_COMMIT"
          fi

          CONFIG_FILE="config/config"
          if [ -z "$LEGACY_SUKISU_CONFIG" ] && [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2- || true)
              if [ -n "$CUSTOM_COMMIT" ]; then
                echo "切换 SUSFS 到自定义提交: $CUSTOM_COMMIT"
                cd susfs4ksu
                retry git checkout "$CUSTOM_COMMIT"
                cd ..
              fi
            fi
          fi

          echo "SUSFS 实际提交: $(git -C susfs4ksu rev-parse HEAD)"
          SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          echo "SUSFS 仓库最新提交日期: $SUSFS_LATEST_COMMIT_DATE"


      - name: 记录 SUSFS 基线快照
        if: inputs.export_susfs_patches && inputs.ksu_mode == '关闭' && inputs.ksu_mode != '禁用KSU' && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU')
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 排除 .rej/.orig 和补丁文件本身：apply.sh 会把 SUSFS 补丁拷进 common/ 并留下 .rej
          cp "$(git rev-parse --git-path index)" /tmp/susfs-base.idx
          export GIT_INDEX_FILE=/tmp/susfs-base.idx
          git add -A -- . ':!*.rej' ':!*.orig' ':!*.patch'
          SUSFS_BASE_TREE=$(git write-tree)
          echo "SUSFS_BASE_TREE=$SUSFS_BASE_TREE" >> $GITHUB_ENV
          echo "SUSFS_PATCH_EXPORT=true" >> $GITHUB_ENV
          echo "基线树对象: $SUSFS_BASE_TREE"


      - name: 应用 SUSFS 补丁
        if: inputs.ksu_mode == '关闭'
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          ANDROID_VERSION: "${{ env.ANDROID_VERSION }}"
          KERNEL_VERSION: "${{ env.KERNEL_VERSION }}"
          KSU_VARIANT: "${{ inputs.kernelsu_variant }}"
          OS_PATCH_LEVEL: "${{ env.OS_PATCH_LEVEL }}"
          SUB_LEVEL: "${{ env.SUB_LEVEL }}"
        run: |
          bash "$GITHUB_WORKSPACE/scripts/susfs_fixes/apply.sh"

      - name: 生成 SUSFS 集成补丁
        if: env.SUSFS_PATCH_EXPORT == 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        env:
          OUT_DIR: "${{ github.workspace }}/susfs-patch"
        run: |
          export_susfs_patch() {
            cp /tmp/susfs-base.idx /tmp/susfs-after.idx || return 1
            export GIT_INDEX_FILE=/tmp/susfs-after.idx
            git add -A -- . ':!*.rej' ':!*.orig' ':!*.patch' || return 1
            local after_tree
            after_tree=$(git write-tree) || return 1
            unset GIT_INDEX_FILE

            mkdir -p "$OUT_DIR"
            git diff --binary "$SUSFS_BASE_TREE" "$after_tree" > "$OUT_DIR/susfs.patch" || return 1
            if [ ! -s "$OUT_DIR/susfs.patch" ]; then
              echo "补丁内容为空"
              return 1
            fi
            # 反向试打，证明补丁与当前工作树完全一致
            git apply --check -R "$OUT_DIR/susfs.patch" || return 1

            local formatted_branch gki_branch gki_commit
            formatted_branch="$ANDROID_VERSION-$KERNEL_VERSION-$OS_PATCH_LEVEL"
            gki_branch="$formatted_branch"
            grep -q deprecated <<< "$REMOTE_BRANCH" && gki_branch="deprecated/$formatted_branch"
            [ -n "$TAG_FALLBACK" ] && gki_branch="refs/tags/$TAG_FALLBACK"
            gki_commit=$(git rev-parse HEAD)

            local ksu_repo ksu_commit ksu_slug ksu_setup_cmd
            ksu_repo=$(git -C "$KERNEL_ROOT/KernelSU" remote get-url origin | sed 's/\.git$//')
            ksu_commit=$(git -C "$KERNEL_ROOT/KernelSU" rev-parse HEAD)
            ksu_slug=${ksu_repo#https://github.com/}
            ksu_setup_cmd="curl -LSs https://raw.githubusercontent.com/$ksu_slug/main/kernel/setup.sh | bash -s $ksu_commit"

            local susfs_repo susfs_branch susfs_commit
            susfs_repo=$(git -C "$SUSFS4KSU" remote get-url origin | sed 's/\.git$//')
            susfs_branch="gki-$ANDROID_VERSION-$KERNEL_VERSION"
            susfs_commit=$(git -C "$SUSFS4KSU" rev-parse HEAD)

            local rej_count patch_sha256
            rej_count=$(comm -23 \
              <(find . -type f -name '*.rej' | sed 's|^\./||' | sort) \
              <(git ls-files -- '*.rej' | while IFS= read -r f; do git diff --quiet -- "$f" && echo "$f"; done | sort) | wc -l)
            patch_sha256=$(sha256sum "$OUT_DIR/susfs.patch" | awk '{print $1}')

            jq -n \
              --arg android_version "$ANDROID_VERSION" \
              --arg kernel_version "$KERNEL_VERSION" \
              --arg sub_level "$SUB_LEVEL" \
              --arg os_patch_level "$OS_PATCH_LEVEL" \
              --arg gki_branch "$gki_branch" \
              --arg gki_commit "$gki_commit" \
              --arg ksu_variant "${{ inputs.kernelsu_variant }}" \
              --arg ksu_repo "$ksu_repo" \
              --arg ksu_commit "$ksu_commit" \
              --arg ksu_setup_cmd "$ksu_setup_cmd" \
              --arg susfs_repo "$susfs_repo" \
              --arg susfs_branch "$susfs_branch" \
              --arg susfs_commit "$susfs_commit" \
              --argjson rej_count "$rej_count" \
              --arg patch_sha256 "$patch_sha256" \
              --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              --arg run_id "$GITHUB_RUN_ID" \
              '$ARGS.named' > "$OUT_DIR/manifest.json" || return 1

            echo "补丁大小: $(du -h "$OUT_DIR/susfs.patch" | cut -f1)，.rej 数量: $rej_count"
            cat "$OUT_DIR/manifest.json"
          }

          if ! export_susfs_patch; then
            echo "::warning::SUSFS 集成补丁导出失败，本次构建不上传补丁"
            rm -rf "$OUT_DIR"
            echo "SUSFS_PATCH_EXPORT=false" >> $GITHUB_ENV
          fi


      - name: 应用 ColorOS 修复补丁
        if: inputs.apply_coloros_patches
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          bash "$TARGET_DIR/scripts/apply_patches.sh" "$TARGET_DIR" "$PWD"


      - name: 克隆 Droidspaces 补丁仓库
        if: inputs.droidspaces != 'off'
        run: |
          git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          echo "DROIDSPACES_PATCHES=/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV


      - name: 集成 NoMount 挂载元模块
        if: inputs.use_nomount
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # NoMount 是挂载元模块，在 fs/ 目录注册子系统，与 SUSFS sus_mount 不冲突。
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

          if [ ! -L "fs/nomount" ]; then
            echo "::error::NoMount 集成失败：fs/nomount 软链接缺失"
            exit 1
          fi
          echo "NoMount 集成完成，commit: $(git -C NoMount rev-parse HEAD)"


      - name: 集成 Droidspaces 支持
        if: inputs.droidspaces != 'off'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          KERNEL_VER="$KERNEL_VERSION"
          SLOT="${{ inputs.droidspaces }}"

          SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
          echo "应用 Droidspaces SYSVIPC kABI 修复补丁 (槽位: $SLOT / $SLOT_NAME)..."
          case "$KERNEL_VER" in
            6.12)
              PATCH_FILE="$DROIDSPACES_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
              ;;
            5.10|5.15|6.1|6.6)
              PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
              ;;
            *)
              echo "::warning::Droidspaces: 未适配的内核版本 $KERNEL_VER，跳过补丁"
              exit 0
              ;;
          esac
          if ! patch -p1 --forward < "$PATCH_FILE"; then
            echo "::warning::SYSVIPC kABI 补丁应用失败，可能已应用或上下文不匹配"
          fi

          if [ "$KERNEL_VER" = "5.10" ]; then
            echo "应用 Droidspaces POSIX_MQUEUE kABI 修复补丁 (5.10)..."
            POSIX_PATCH="$DROIDSPACES_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
            if ! patch -p1 --forward < "$POSIX_PATCH"; then
              echo "::warning::POSIX_MQUEUE kABI 补丁应用失败，可能已应用或上下文不匹配"
            fi
          fi

          if [ "$KERNEL_VER" = "6.12" ]; then
            if [ -f "ipc/msgutil.c" ] && ! grep -qF 'EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"; then
              sed -i '/^struct msg_msgseg {/i EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"
              echo "已为 init_ipc_ns 补充符号导出"
            fi

            if [ -f "ipc/namespace.c" ] && ! grep -qF 'EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"; then
              sed -i '/^static struct ns_common \*ipcns_get(/i EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"
              echo "已为 put_ipc_ns 补充符号导出"
            fi
          fi

          echo "Droidspaces 集成完成"


      - name: 注入 NTSync 内核配置
        if: inputs.droidspaces != 'off' && inputs.droidspaces_ntsync
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          echo "=== 开始注入 NTSync 内核补丁 ==="

          case "$ANDROID_VERSION-$KERNEL_VERSION" in
            android12-5.10) NTSYNC_PATCH="ntsync_compat_android12-5.10" ;;
            android13-5.15) NTSYNC_PATCH="ntsync_compat_android13-5.15" ;;
            android14-6.1)  NTSYNC_PATCH="ntsync_compat_android14-6.1" ;;
            android15-6.6)  NTSYNC_PATCH="ntsync_compat_android15-6.6" ;;
            android16-6.12) NTSYNC_PATCH="ntsync_compat_android16-6.12" ;;
            *)
              echo "::warning::NTSync: 未适配 $ANDROID_VERSION / $KERNEL_VERSION，跳过补丁"
              exit 0
              ;;
          esac

          echo "自动选择 NTSync 补丁: ${NTSYNC_PATCH}.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/ntsync_base.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/${NTSYNC_PATCH}.patch"

          patch -p1 < "ntsync_base.patch"
          patch -p1 < "${NTSYNC_PATCH}.patch"

          echo "=== NTSync 补丁注入完成 ==="


      - name: 应用 Unicode 绕过修复
        if: inputs.ksu_mode == '关闭'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 上游 2023-11、2024-01、2024-03 月度分支已带 unicode 修复，
          # patch --forward 会判定为已应用并跳过，但被忽略的 hunk 仍会写成 .rej
          if [ -f fs/unicode/mkutf8data.c ] && ! grep -q 'ignore_init' fs/unicode/mkutf8data.c; then
            echo "源码已包含 Unicode 绕过修复，跳过补丁"
            exit 0
          fi
          if [ "$KERNEL_VERSION" = "5.10" ] || [ "$KERNEL_VERSION" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi


      - name: 准备配置
        run: |
          bash "$TARGET_DIR/scripts/prepare_config.sh" "$TARGET_DIR" \
            "$KERNEL_ROOT/common" "$OUT_DIR"

                    # 关键：从此以后所有特性步骤的 $DEFCONFIG 都指向我们的 .config，
                    # 而不是源码树里的 gki_defconfig。这样 ZRAM/BBG/网络增强等步骤
                    # 追加的 CONFIG 才会真正进入编译基线。
                    echo "DEFCONFIG=$OUT_DIR/.config" >> $GITHUB_ENV
                    echo "DEFCONFIG 已重定向 -> $OUT_DIR/.config"


      - name: 配置 ZRAM LZ4 补丁栈
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          echo "升级 LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          bash $ZZH_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/$KERNEL_VERSION/lz4kd.patch ./
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::lz4kd.patch 应用失败，可能已应用或上下文不匹配"
          fi

          cp $SUKISU_PATCHES/other/zram/zram_patch/$KERNEL_VERSION/lz4k_oplus.patch ./
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::lz4k_oplus.patch 应用失败，可能已应用或上下文不匹配"
          fi


      - name: 配置 ZRAM 选项
        if: inputs.use_zram
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if [ "$KERNEL_VERSION" != "6.6" ] && [ "$KERNEL_VERSION" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "$ANDROID_VERSION" = "android14" ] || [ "$ANDROID_VERSION" = "android15" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
          fi

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            cat "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
          fi


      - name: 添加 BBG 防格机补丁
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> "$DEFCONFIG"
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig


      - name: 应用网络增强（BBRv3 / IPSet / Qdisc / CIFS）
        if: inputs.use_networking
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail

          BBR3_DIR="$KERNEL_PATCHES/common/bbrv3"
          KVER="$KERNEL_VERSION"
          AVER="$ANDROID_VERSION"

          case "$AVER-$KVER" in
            android12-5.10) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch" ;;
            android13-5.15) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android13-5.15.patch" ;;
            android14-6.1)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" ;;
            android15-6.6)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch" ;;
            *) BBR3_PATCH="" ;;
          esac

          if [ -n "$BBR3_PATCH" ]; then
            if [ ! -f "$BBR3_PATCH" ]; then
              echo "::error::BBRv3 补丁不存在: $BBR3_PATCH" >&2
              exit 1
            fi
            if patch -p1 --dry-run < "$BBR3_PATCH" >/dev/null 2>&1; then
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH"
              echo "[+] BBRv3 补丁已应用"
            else
              echo "::error::BBRv3 补丁应用失败，保留 .rej 供汇总产物分析" >&2
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH" || true
              exit 1
            fi
          else
            echo "[*] $AVER-$KVER 无 BBRv3 backport，跳过补丁"
          fi

          set_config() {
            local key="$1" value="$2"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
          }

          for cfg in IP_SET IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC IP_SET_BITMAP_PORT \
            IP_SET_HASH_IP IP_SET_HASH_IPMARK IP_SET_HASH_IPPORT IP_SET_HASH_IPPORTIP \
            IP_SET_HASH_IPPORTNET IP_SET_HASH_IPMAC IP_SET_HASH_MAC \
            IP_SET_HASH_NETPORTNET IP_SET_HASH_NET IP_SET_HASH_NETNET \
            IP_SET_HASH_NETPORT IP_SET_HASH_NETIFACE IP_SET_LIST_SET \
            NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_SET NETFILTER_XT_TARGET_LOG \
            NETFILTER_XT_MATCH_RECENT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE; do
            set_config "CONFIG_$cfg" y
          done
          set_config CONFIG_IP_SET_MAX 65534

          for cfg in TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_CUBIC \
            TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP; do
            set_config "CONFIG_$cfg" y
          done
          if [ -n "$BBR3_PATCH" ]; then
            set_config CONFIG_TCP_CONG_BBR3 y
            set_config CONFIG_DEFAULT_BBR3 y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr3"'
          else
            set_config CONFIG_DEFAULT_BBR y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr"'
          fi

          for cfg in NET_SCH_FQ NET_SCH_FQ_CODEL NET_SCH_CAKE NET_ACT_CONNMARK \
            IP_NF_TARGET_TTL IP6_NF_TARGET_HL IP6_NF_MATCH_HL WIREGUARD; do
            set_config "CONFIG_$cfg" y
          done

          for cfg in CIFS NETWORK_FILESYSTEMS KEYS CIFS_XATTR CIFS_POSIX; do
            set_config "CONFIG_$cfg" y
          done

          echo "[+] 网络增强配置完成"


      - name: 应用 Re-Kernel
        if: inputs.use_rekernel
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          echo "Integrating Re-Kernel..."
          TMP_REKERNEL=/tmp/rekernel
          rm -rf "$TMP_REKERNEL"
          git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"

          rm -rf common/drivers/rekernel
          mkdir -p common/drivers/rekernel
          cp -a "$TMP_REKERNEL/LKM-Source/." common/drivers/rekernel/

          REKERNEL_MAKEFILE="common/drivers/rekernel/Makefile"
          sed -i 's/^obj-m := rekernel\.o$/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$REKERNEL_MAKEFILE"
          grep -qF 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' "$REKERNEL_MAKEFILE" || \
            echo 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' >> "$REKERNEL_MAKEFILE"
          sed -i '/^[[:space:]]*depends on MODULES[[:space:]]*$/d' common/drivers/rekernel/Kconfig

          if ! grep -qF 'source "drivers/rekernel/Kconfig"' common/drivers/Kconfig; then
            sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' common/drivers/Kconfig
          fi
          if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' common/drivers/Makefile; then
            echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> common/drivers/Makefile
          fi

          sed -i 's|#include <../android/binder_internal.h>|#include "../android/binder_internal.h"|g' common/drivers/rekernel/rekernel_binder.c
          grep -qF '#include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c || \
            sed -i '/#include <linux\/kprobes.h>/a #include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c


      - name: 追加 KernelSU / SUSFS / ZRAM / 各特性配置
        run: |
          CFG="$OUT_DIR/.config"
          append() { grep -q "^$1" "$CFG" || echo "$1" >> "$CFG"; }

          # KSU
          if [ "${{ inputs.ksu_mode }}" != "禁用KSU" ]; then
            append "CONFIG_KSU=y"
          fi

          # KPM
          if [ "${{ inputs.ksu_mode }}" != "禁用KSU" ] && { [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ] || [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ] || [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ] || [ "${{ inputs.kernelsu_variant }}" == "Next" ]; }; then
            if [[ "${{ inputs.use_kpm }}" == enabled* ]] || [[ "${{ inputs.use_kpm }}" == patched* ]]; then
              if ! grep -RqsE '^[[:space:]]*config[[:space:]]+KPM([[:space:]]|$)' "$KERNEL_ROOT/common" "$KERNEL_ROOT/KernelSU" 2>/dev/null; then
                echo "错误: 已请求启用 KPM，但当前 KernelSU 代码未声明 CONFIG_KPM" >&2
                exit 1
              fi
              append "CONFIG_KPM=y"
            fi
          fi

          # SUSFS
          if [ "${{ inputs.ksu_mode }}" = "关闭" ]; then
            for c in CONFIG_KSU_SUSFS=y \
                     CONFIG_KSU_SUSFS_SUS_PATH=y \
                     CONFIG_KSU_SUSFS_SUS_MOUNT=y \
                     CONFIG_KSU_SUSFS_SUS_KSTAT=y \
                     CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
                     CONFIG_KSU_SUSFS_ENABLE_LOG=y \
                     CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
                     CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
                     CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
                     CONFIG_KSU_SUSFS_SUS_MAP=y; do
              append "$c"
            done
          fi

          # NoMount
          if [ "${{ inputs.use_nomount }}" == "true" ]; then
            append "CONFIG_NOMOUNT=y"
          fi

          # Re-Kernel
          if [ "${{ inputs.use_rekernel }}" == "true" ]; then
            append "CONFIG_REKERNEL=y"
            append "CONFIG_REKERNEL_NETWORK=y"
          fi


      - name: 设置内核版本串
        run: |
          # 原厂 /proc/version 为 6.1.128-android14-11-g5c2cea985a84-ab13606743
          # 开启 CONFIG_MODVERSIONS 后 same_magic() 只比对版本串之后的
          # "SMP preempt mod_unload modversions aarch64"，但保持外观一致
          # 可以避免工具与脚本里的字符串判断出错。
          LOCAL="-android14-11-g$(echo $GKI_COMMIT | cut -c1-12)-ACLaniakea"
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"$LOCAL\"|" "$OUT_DIR/.config"
          echo "CONFIG_LOCALVERSION=\"$LOCAL\""


      - name: 编译内核
        run: |
          set -o pipefail

          # repo 同步的树自带 clang 预编译（android14-6.1 为 clang-r487747c，
          # 与原厂 /proc/version 的编译器一致）。plain make 不会自动把它加进
          # PATH，必须显式指定，否则 LLVM=1 会落到 runner 的系统 clang 上，
          # 产物与原厂 CRC 可能漂移。
          CLANG_BIN=$(ls -d "$KERNEL_ROOT"/prebuilts/clang/host/linux-x86/clang-*/bin 2>/dev/null | head -n1)
          if [ -n "$CLANG_BIN" ]; then
            export PATH="$CLANG_BIN:$PATH"
            echo "使用树内 clang: $CLANG_BIN"
          else
            echo "::warning::未找到树内 clang 预编译，回退系统 clang"
          fi

          make -C "$KERNEL_ROOT/common" O="$OUT_DIR" ARCH=arm64 LLVM=1 \
            CC="ccache clang" olddefconfig

          # 原厂与 pad 的 r3 配置都是 CONFIG_LTO_NONE=y，与通用 GKI 的
          # --lto=thin 冲突。这里用 make 而非 bazel，LTO 由 .config 决定。
          grep -E '^CONFIG_LTO' "$OUT_DIR/.config" || true

          time make -C "$KERNEL_ROOT/common" O="$OUT_DIR" ARCH=arm64 LLVM=1 \
            CC="ccache clang" -j"$(nproc)" Image modules_prepare 2>&1 | tee build.log

          ls -la "$OUT_DIR/arch/arm64/boot/Image"
          strings "$OUT_DIR/arch/arm64/boot/Image" | grep -m1 'Linux version'


      - name: vendor ABI 门禁
        if: success()
        run: |
          bash "$TARGET_DIR/scripts/verify_abi.sh" "$OUT_DIR"


      - name: 准备产物
        run: |
          mkdir -p artifacts
          cp "$OUT_DIR/arch/arm64/boot/Image" artifacts/
          cp "$OUT_DIR/Module.symvers" artifacts/ || true
          cp "$OUT_DIR/.config" artifacts/config-final.txt
          cp "$OUT_DIR/config-drift.txt" artifacts/ 2>/dev/null || echo "无配置漂移" > artifacts/config-drift.txt
          [ -f build.log ] && cp build.log artifacts/ || true
          gzip -n -k -f -9 artifacts/Image
          ls -la artifacts/


      - name: 打包 AnyKernel3
        run: |
          IMG="artifacts/Image"
          [ -f "$IMG" ] || { echo "::error::找不到 Image"; exit 1; }

          cp "$IMG" "$ANYKERNEL3/Image"

          # TB710FU 专用 anykernel.sh 配置：
          #  - split_boot：本机 boot.img 的 ramdisk size 为 0，dump_boot 会失败
          #  - is_slot_device=auto：boot_a / boot_b 物理存在（Virtual A/B）
          #  - devicecheck：防止误刷到其他机型
          cat > "$ANYKERNEL3/anykernel.sh" <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## TB710FU / Lenovo Xiaoxin Pad Pro GT (SM8650Q / pineapple)
          ## 由 kernel-tb710fu.yml 生成

          properties() { '
          kernel.string=ACLaniakea GKI 6.1.128 (ColorOS 16 port)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=TB710FU
          device.name2=Lenovo TB710FU
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . "$(dirname "$0")/tools/ak3-core.sh";

          # 本机 boot.img 内 ramdisk size = 0（通用 ramdisk 在 init_boot，
          # 第一阶段在 vendor_boot）。split_boot 只切分 kernel，不碰 ramdisk，
          # 正是 GKI 拆分布局所需的路径。
          split_boot;

          flash_boot;
          AK3

          chmod +x "$ANYKERNEL3/anykernel.sh"

          ZIP="TB710FU-$ANDROID_VERSION-$KERNEL_VERSION.$SUB_LEVEL-AnyKernel3.zip"
          ( cd "$ANYKERNEL3" && zip -r "$GITHUB_WORKSPACE/artifacts/$ZIP" ./* -x '.git/*' )
          ls -la "artifacts/$ZIP"


      - name: 生成校验和与说明
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt || true
          cat > README-build.txt <<EOF
          TB710FU / SM8650Q 内核构建产物
          内核版本 : $KERNEL_VERSION.$SUB_LEVEL
          GKI commit: $GKI_COMMIT
          KSU 变体 : ${{ inputs.kernelsu_variant }}（模式：${{ inputs.ksu_mode }}）
          构建时间 : $(date -u '+%Y-%m-%dT%H:%M:%SZ')

          特性开关
          --------
          KPM         : ${{ inputs.use_kpm }}
          ColorOS补丁 : ${{ inputs.apply_coloros_patches }}
          ZRAM 增强   : ${{ inputs.use_zram }}
          BBG         : ${{ inputs.use_bbg }}
          Re-Kernel   : ${{ inputs.use_rekernel }}
          NoMount     : ${{ inputs.use_nomount }}
          网络增强    : ${{ inputs.use_networking }}
          CVE-43499   : ${{ inputs.cve_2026_43499_patch }}
          一加8E      : ${{ inputs.supp_op }}
          Droidspaces : ${{ inputs.droidspaces }}
          NTSync      : ${{ inputs.droidspaces_ntsync }}

          刷入说明
          --------
          1. 本包只含 boot 分区的内核。使用 split_boot，不会改动 ramdisk。
          2. 必须与 vendor_boot-hyperSched-stub.img 成对刷入：
               fastboot flash boot        <解出的 boot.img 或本包>
               fastboot flash vendor_boot vendor_boot-hyperSched-stub.img
             只刷 boot 不刷 vendor_boot：联想真身 hyperSched 仍在，会与
             一加 sched_assist 抢同一批 rvh 钩子。
          3. KernelSU 的 LKM 位于 init_boot，本包不替代它。
          4. 刷前备份：boot_a / vendor_boot_a / init_boot_a。
          5. 起不来时先读 /sys/fs/pstore/console-ramoops-0，再决定下一步。
          EOF
          cat README-build.txt


      - name: 上传 AnyKernel3
        if: inputs.artifact_upload_mode == '仅上传 AnyKernel3.zip'
        uses: actions/upload-artifact@v6
        with:
          name: TB710FU-kernel-${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}-AnyKernel3
          path: artifacts/*AnyKernel3.zip
          compression-level: 9

      - name: 上传全部产物
        if: inputs.artifact_upload_mode == '上传全部'
        uses: actions/upload-artifact@v6
        with:
          name: TB710FU-kernel-${{ env.KERNEL_VERSION }}.${{ env.SUB_LEVEL }}-full
          path: artifacts/
          compression-level: 9

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TB710FU-build-logs
          path: |-
            build.log
            kernel-out/config-drift.txt
            kernel-out/config-final.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

